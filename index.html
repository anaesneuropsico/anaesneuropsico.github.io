<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ana Esperanza Lagares | Neuropsicología</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    color: #3B332B;
    background-color: #F6F1E9;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; font-weight: 500; }

  /* NAV */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    background-color: #F6F1E9;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    box-shadow: 0 1px 0 rgba(59,51,43,0.08);
  }
  nav .logo {
    font-family: 'Fraunces', serif;
    font-size: 1.1rem;
    color: #3B332B;
  }
  nav ul {
    list-style: none;
    display: flex;
    gap: 28px;
  }
  nav ul li a {
    text-decoration: none;
    color: #3B332B;
    font-size: 0.85rem;
    letter-spacing: 0.5px;
  }
  nav ul li a:hover { color: #C08A6B; }

  /* HERO */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 20px;
  }
  .hero p.eyebrow {
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 0.75rem;
    color: #7FA6A0;
    margin-bottom: 18px;
  }
  .hero h1 {
    font-size: 2.8rem;
    margin-bottom: 14px;
  }
  .hero .accent-line {
    width: 40px;
    height: 3px;
    background-color: #C08A6B;
    border: none;
    margin: 20px 0;
  }
  .hero p.tagline {
    font-size: 1.1rem;
    color: #6B6259;
    max-width: 420px;
  }

  section { padding: 80px 40px; max-width: 900px; margin: 0 auto; }

  @media (max-width: 600px) {
    nav ul { gap: 14px; }
    nav ul li a { font-size: 0.7rem; }
    .hero h1 { font-size: 2rem; }
  }
</style>
</head>
<body>

<nav>
  <div class="logo">Ana Esperanza</div>
  <ul>
    <li><a href="#sobre-mi">Sobre mí</a></li>
    <li><a href="#servicios">Servicios</a></li>
    <li><a href="#resenas">Reseñas</a></li>
    <li><a href="#contacto">Contacto</a></li>
  </ul>
</nav>

<div class="hero">
  <p class="eyebrow">Neuropsicología</p>
  <h1>Ana Esperanza Lagares</h1>
  <hr class="accent-line">
  <p class="tagline">Acercando la neurociencia al día a día 🧠</p>
</div>

<!-- Aquí seguirán el resto de secciones: Sobre mí, Servicios, Reseñas, Contacto -->

</body>
</html>
